<header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest border-b border-outline-variant/30">
  <div class="h-14 w-full px-3 sm:px-6 flex items-center justify-between">
    <div class="flex items-center gap-2 sm:gap-space-md">
      <div class="flex items-center gap-1.5 sm:gap-space-sm cursor-pointer group" (click)="state.resetView()">
        <img src="logo.png" alt="UaiGraph Logo" class="w-8 h-8 sm:w-10 sm:h-10 object-contain transition-transform group-hover:scale-105">
        <span class="font-headline-sm text-[17px] sm:text-headline-sm text-on-surface leading-tight tracking-tight font-semibold">UaiGraph</span>
      </div>
      
      <div class="h-5 sm:h-6 w-px bg-outline-variant/40"></div>
      <button (click)="state.toggleDossierDrawer()" class="md:hidden flex items-center gap-1 px-2.5 py-1 rounded-full border border-primary/30 bg-primary/10 text-primary text-[11px] font-semibold active:scale-95 transition-all">
        <span class="material-symbols-outlined text-[15px]">folder_shared</span>
        <span>Dossiês</span>
        <span class="text-[9px] px-1 rounded-full bg-primary text-white font-bold">{{ state.allPoliticians().length || 53 }}</span>
      </button>
      <nav class="hidden md:flex items-center gap-1">
        <button (click)="state.setGraphMode('all')" [ngClass]="state.graphFilterMode() === 'all' ? 'bg-primary/10 text-primary font-semibold border-primary/30' : 'text-on-surface-variant hover:text-on-surface border-transparent hover:border-outline-variant/40'" class="px-3 py-1 rounded-full border text-[12px] transition-all">
          <span class="material-symbols-outlined text-[15px] align-middle mr-0.5">hub</span> Grafo
        </button>
        <button (click)="state.toggleDossierDrawer()" class="px-3 py-1 rounded-full border border-transparent text-on-surface-variant hover:text-on-surface hover:border-outline-variant/40 text-[12px] transition-all">
          <span class="material-symbols-outlined text-[15px] align-middle mr-0.5">folder_shared</span> Dossiês
          <span class="text-[10px] px-1 py-0.5 rounded-full bg-primary/10 text-primary font-bold ml-0.5">{{ state.allPoliticians().length || 53 }}</span>
        </button>
        <button (click)="state.setGraphMode('coautoria')" [ngClass]="state.graphFilterMode() === 'coautoria' ? 'bg-primary/10 text-primary font-semibold border-primary/30' : 'text-on-surface-variant hover:text-on-surface border-transparent hover:border-outline-variant/40'" class="px-3 py-1 rounded-full border text-[12px] transition-all">
          <span class="material-symbols-outlined text-[15px] align-middle mr-0.5">handshake</span> Coautoria
        </button>
        <button (click)="state.setGraphMode('partidos')" [ngClass]="state.graphFilterMode() === 'partidos' ? 'bg-primary/10 text-primary font-semibold border-primary/30' : 'text-on-surface-variant hover:text-on-surface border-transparent hover:border-outline-variant/40'" class="px-3 py-1 rounded-full border text-[12px] transition-all">
          <span class="material-symbols-outlined text-[15px] align-middle mr-0.5">flag</span> Partidos
        </button>
      </nav>
    </div>
    <div class="flex items-center gap-1.5 sm:gap-space-sm">
      <button (click)="state.printDossier()" class="inline-flex items-center gap-1 px-2.5 sm:px-3 py-1.5 rounded-lg bg-primary text-on-primary hover:bg-primary-container text-[11px] font-semibold transition-colors shadow-sm" type="button" title="Exportar PDF do dossiê">
        <span class="material-symbols-outlined text-[15px]">download</span>
        <span class="hidden sm:inline">Exportar PDF</span>
      </button>
    </div>
  </div>
</header>
