<!-- MODAL: DETALHES COMPLETOS DA PROPOSIÇÃO (CARD DE DESCRIÇÃO) -->
<div *ngIf="state.selectedBillModal()" class="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 transition-all" (click)="state.closeBillModal()">
  <div class="relative w-full max-w-lg bg-surface-container-lowest border border-outline-variant/60 rounded-xl sm:rounded-2xl shadow-2xl overflow-hidden p-4 sm:p-6 space-y-4 max-h-[90dvh] flex flex-col" (click)="$event.stopPropagation()">
    
    <!-- Top Header -->
    <div class="flex items-start justify-between gap-3 border-b border-outline-variant/30 pb-3 flex-shrink-0">
      <div class="space-y-1">
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-700 border border-amber-500/30 text-[10px] font-label-caps font-bold uppercase">
            {{ state.selectedBillModal()?.relation || 'PROPOS' }}
          </span>
          <span class="font-data-mono-sm text-[11px] text-outline">Matéria Legislativa Oficial</span>
        </div>
        <h3 class="font-headline-md text-[17px] sm:text-[19px] text-primary font-bold tracking-tight">
          {{ state.selectedBillModal()?.label }}
        </h3>
      </div>
      <button (click)="state.closeBillModal()" class="p-1.5 rounded-lg hover:bg-surface-container text-on-surface-variant hover:text-on-surface transition-colors" title="Fechar">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>

    <!-- Ementa Completa -->
    <div class="space-y-2 flex-1 overflow-y-auto">
      <h4 class="font-label-caps text-[11px] uppercase text-outline font-semibold tracking-wider flex items-center gap-1.5">
        <span class="material-symbols-outlined text-[16px] text-primary">description</span>
        Ementa Oficial da Câmara dos Deputados
      </h4>
      <div class="p-3 sm:p-4 rounded-xl bg-surface-container-low border border-outline-variant/40 text-on-surface font-data-mono-sm text-[12px] sm:text-[13px] leading-relaxed select-text">
        {{ state.selectedBillModal()?.ementa || 'Sem descrição/ementa cadastrada para esta matéria.' }}
      </div>
    </div>

    <!-- Ações e Rodapé do Modal -->
    <div class="pt-2 flex items-center justify-end border-t border-outline-variant/30 flex-shrink-0">
      <a [href]="'https://www.camara.leg.br/busca-geral?termo=' + encodeUri(state.selectedBillModal()?.label)" target="_blank" class="px-3.5 py-2 rounded-lg bg-primary/10 text-primary hover:bg-primary/20 text-[12px] font-semibold flex items-center gap-1.5 transition-colors">
        <span>Portal da Câmara</span>
        <span class="material-symbols-outlined text-[14px]">open_in_new</span>
      </a>
    </div>

  </div>
</div>
